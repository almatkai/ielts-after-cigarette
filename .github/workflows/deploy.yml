name: Test, build, and deploy

# Pushes to dev run tests only (no dev build/deploy: a single, production
# environment is deployed on the server). Pushes to main additionally build
# the production image and deploy it. Because both jobs live in one
# branch-aware file, merging dev into main never removes the production
# pipeline again.

on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: iac-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: iac-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --check
          README.md package.json vite.config.ts
          src/components/auth src/features/auth src/lib/api/client.ts
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec vite build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./iac-web
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '9865' }}
      WEB_PORT: ${{ vars.WEB_PORT }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/ielts_web_deploy
          chmod 600 ~/.ssh/ielts_web_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk -v host="$DEPLOY_HOST" -v port="$DEPLOY_PORT" '/^#/ || /^$/ || /^\[/ { print; next } { $1 = "[" host "]:" port; print }' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Prepare deployment files
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}:main"
          printf 'WEB_IMAGE=%s\nWEB_PORT=%s\n' "$image_name" "$WEB_PORT" > production.env
          tar -czf deployment.tar.gz docker-compose.production.yml scripts/deploy-production.sh production.env
      - name: Upload deployment files
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_web_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'install -d -m 700 ~/ielts-web'
          scp -P "$DEPLOY_PORT" -i ~/.ssh/ielts_web_deploy deployment.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:ielts-web/deployment.tar.gz"
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_web_deploy "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 ~/ielts-web/.docker && DOCKER_CONFIG=~/ielts-web/.docker docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/ielts_web_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/ielts-web && tar -xzf deployment.tar.gz && bash scripts/deploy-production.sh' </dev/null
